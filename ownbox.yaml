schema: 1
name: hotline-call
description: Phone calls between Claude Code sessions and people — the SIP ring, the voice on an answered call, inbound calls, and the hotline-call CLI agents use to ring Bogdan.
homepage: https://github.com/BogdanStamenovic/hotline-call
tags: [sip, voip, phone, voice, whisper, tts, claude, agents, python, systemd]
install:
  platforms: [linux]
  setup:
    linux: [./ownbox.sh setup]
  update:
    linux: [./ownbox.sh update]
  remove:
    linux: [./ownbox.sh remove]
commands:
  hotline-call:
    linux: .venv/bin/hotline-call
  hotline-calld:
    linux: ./ownbox.sh status
